AWSTemplateFormatVersion: '2010-09-09'
Description: portale its

Parameters:
  ApiTokenGestionale:
    Type: String
    Description: token per il gestionale, non cambiarlo
    NoEcho: true

Resources:

  SitoBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "portale-its-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Progetto
          Value: portale-its

  IscrizioniTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: iscrizioni
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: iscrizioneId
          AttributeType: S
      KeySchema:
        - AttributeName: iscrizioneId
          KeyType: HASH

Outputs:
  Sito:
    Value: !GetAtt SiteBucket.WebsiteURL
